<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse o GeoImpacto para jogar o quiz e entrar no pódio.">
  <meta name="theme-color" content="#1E3D59">
  <title>Cadastro · GeoImpacto</title>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/pages/auth.css">
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/api.js" defer></script>
  <script src="../assets/js/layout.js" defer></script>
  <script src="../assets/js/pages/auth.js" defer></script>
</head>
<body class="page-auth">
<main id="conteudo" class="auth">
  <section class="auth-main">
    <a class="logo auth-logo" href="../index.html" aria-label="GeoImpacto — página inicial">
      <img src="../assets/img/logo.webp" alt="" width="80" height="80">
    </a>
    <form class="auth-form" data-auth="cadastro" novalidate>
      <h1>Registre-se</h1>
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome…" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome…" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email…" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha…" autocomplete="new-password" required>
      </div>
      <p class="form-message" role="alert" hidden></p>
      <button class="btn btn--azul btn--block" type="submit">Junte-se a nós <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <p class="auth-switch">Já tem uma conta? <a href="./login.html">Entre</a></p>
    </form>
  </section>
  <aside class="auth-aside">
    <div class="auth-aside__content">
      <span class="eyebrow">Aprenda</span>
      <h2>Seguimos juntos nos seus estudos</h2>
      <p>Entre em contato conosco para dúvidas, assistência técnica ou oportunidades de colaboração por meio das informações de contato fornecidas.</p>
